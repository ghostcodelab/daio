[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read-write", path = "./deployments" }]
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/",
]

[profile.ci]
fuzz = { runs = 10000 }
verbosity = 4

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"

[rpc_endpoints]
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC_URL}"

[etherscan]
arbitrum_sepolia  = { key = "${ETHERSCAN_API_KEY}", chain = 421614, url = "https://api.etherscan.io/v2/api" }
# Robinhood Chain testnet verifier — fill in after the Jun 2 workshop when
# the canonical block explorer + API URL are published. Likely a Blockscout
# instance; set chain id to the announced value.
# robinhood_testnet = { key = "${ROBINHOOD_EXPLORER_API_KEY}", chain = <id>, url = "<api-url>" }
