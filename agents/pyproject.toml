[project]
name = "daio-agents"
version = "0.0.1"
description = "Reference agents for the Daio DAO-of-agents fund."
requires-python = ">=3.12"
dependencies = [
    "openai>=1.50.0",
    "web3>=7.0.0",
    "eth-account>=0.13.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.4.0",
    "httpx>=0.27.0",
]

[project.scripts]
daio-macro = "daio_agents.macro.main:main"
daio-credit = "daio_agents.credit.main:main"
daio-demo = "daio_agents.demo:main"
daio-orchestrator = "daio_agents.orchestrator:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["daio_agents"]

[tool.ruff]
line-length = 120
target-version = "py312"
